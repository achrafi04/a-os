<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#070B0A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="A.OS" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<title>Livres · A.OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("patron_theme")||"nocturne");}catch(e){document.documentElement.setAttribute("data-theme","nocturne");}</script>
<link rel="stylesheet" href="theme.css" />
<style>
  .sectionHead { display:flex; align-items:center; justify-content:space-between; margin: var(--space-6) 0 var(--space-4); }
  .sectionHead h2 { font-family: var(--font-display); font-style:italic; font-weight:500; font-size: var(--text-xl); margin:0; }
  .bookList { display:flex; flex-direction:column; gap: var(--space-2); }
  .book { display:flex; align-items:center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border:1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .book:hover { border-color: var(--border-strong); }
  .bMain { flex:1; min-width:0; }
  .bTitle { font-family: var(--font-display); font-style:italic; font-weight:500; font-size: var(--text-base); color: var(--fg); }
  .bMeta { font-family: var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .pill { font-family:var(--font-mono); font-size:10px; font-weight:600; padding:3px 9px; border-radius:999px; flex-shrink:0; }
  .pill.toread { background: var(--surface-2); color: var(--muted-strong); border:1px solid var(--border); }
  .pill.reading { background: var(--warn-soft); color: var(--warn); border:1px solid var(--warn-line); }
  .pill.done { background: var(--pos-soft); color: var(--pos); border:1px solid var(--pos-line); }
  .iconBtn { appearance:none; background:transparent; border:1px solid var(--border); color:var(--muted); width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:13px;flex-shrink:0; }
  .iconBtn:hover { color:var(--fg); border-color:var(--border-strong); }
  .empty { font-family: var(--font-mono); font-size:12px; color: var(--muted); padding: var(--space-5); text-align:center; }
  /* council */
  .councilIntro { font-family: var(--font-display); font-style:italic; font-size: var(--text-lg); color: var(--muted-strong); line-height:1.5; margin: 0 0 var(--space-4); }
  .progress { font-family:var(--font-mono); font-size:11px; color:var(--brand-2); letter-spacing:.08em; }
  .fig { border:1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); padding: var(--space-5); margin-bottom: var(--space-3); box-shadow: var(--card-shadow); }
  .fig.is-done { border-color: var(--pos-line); }
  .figTop { display:flex; align-items:flex-start; gap: var(--space-3); }
  .figNum { font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.4rem; color: var(--brand-2); width:34px; flex-shrink:0; }
  .figName { font-family:var(--font-display); font-style:italic; font-weight:500; font-size: var(--text-xl); }
  .figVirtue { font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--muted); margin-top:2px; }
  .figText { font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; color: var(--muted-strong); margin-top:8px; }
  .figLesson { font-size: var(--text-sm); line-height:1.55; color: var(--fg); margin-top:10px; }
  .figModern { font-size: 13px; line-height:1.5; color: var(--muted-strong); margin-top:6px; }
  .figModern b { color: var(--brand-2); font-weight:600; }
  .figCheck { appearance:none; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:5px 12px; font-family:var(--font-ui); font-weight:600; font-size:12px; cursor:pointer; margin-left:auto; flex-shrink:0; }
  .figCheck.on { background: var(--pos-soft); color: var(--pos); border-color: var(--pos-line); }
</style>
</head>
<body>
<main class="page grain-overlay">
  <div class="shell">
    <header class="header">
      <div>
        <h1 class="title">Livres</h1>
        <p class="subtitle">Bibliothèque · Council of Eleven</p>
      </div>
      <div class="headerControls">
        <a class="backLink" href="index.html">← Dashboard</a>
        <span id="themeSeg"></span>
      </div>
    </header>

    <div class="sectionHead">
      <h2>Bibliothèque</h2>
      <button class="btn btn-ghost" id="addBook">+ Add book</button>
    </div>
    <div class="bookList" id="bookList"></div>

    <div class="sectionHead">
      <h2>Council of Eleven</h2>
      <span class="progress" id="councilProg">0 / 11</span>
    </div>
    <p class="councilIntro">Convene the dead. Steal one virtue from each — one figure per fortnight, one text, one lesson.</p>
    <div id="council"></div>
  </div>
</main>

<div class="overlay" id="overlay" style="display:none">
  <div class="panel">
    <div class="panelHead">
      <div><div class="panelEyebrow">Book</div><h2 class="panelTitle" id="mTitle">Add book</h2></div>
      <button class="panelClose" id="mClose">×</button>
    </div>
    <div id="mBody"></div>
    <div class="panelActions">
      <button class="btn btn-ghost" id="mDelete" style="margin-right:auto; display:none">Delete</button>
      <button class="btn btn-ghost" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script>
  try { document.getElementById('themeSeg').innerHTML = Patron.switcherHtml(); } catch(e){}
  const KEY='livres_standalone_v1';
  function storeGet(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }
  function storeSet(v){ try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){} }
  const uid=()=>Math.random().toString(36).slice(2,9);
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  const COUNCIL = [
    { n:1,  name:"Marcus Aurelius", virtue:"Self-mastery", text:"Meditations", lesson:"Govern your reactions; the rest isn't yours.", modern:"Own your reactions or the feed owns you." },
    { n:2,  name:"Machiavelli",     virtue:"Clear sight",  text:"The Prince", lesson:"See people as they are, not as you wish.", modern:"Cut through the spin to what's real." },
    { n:3,  name:"Leonardo da Vinci",virtue:"Curiosity",   text:"Notebooks (Codex selections)", lesson:"Connect domains nobody else connects.", modern:"Your edge: ML × medicine × P4." },
    { n:4,  name:"Sun Tzu",         virtue:"Positioning",  text:"The Art of War", lesson:"Win by positioning before you fight.", modern:"Choose the right game, not the hard grind." },
    { n:5,  name:"Napoleon",        virtue:"Concentration",text:"Maxims / a tight biography", lesson:"Concentrate force at the decisive point.", modern:"Don't fight your four fronts at once." },
    { n:6,  name:"Carl Jung",       virtue:"Self-knowledge",text:"Man and His Symbols → Memories, Dreams, Reflections", lesson:"Integrate the shadow you're hiding.", modern:"Know your real drives behind the persona." },
    { n:7,  name:"Andrew Carnegie", virtue:"Reinvention",  text:"Autobiography", lesson:"Reinvent; enlist people better than you.", modern:"Leverage through people, not your own hours." },
    { n:8,  name:"John D. Rockefeller",virtue:"Systems",   text:"Titan (Chernow)", lesson:"Build the system before the scale.", modern:"Systems first — scale only amplifies." },
    { n:9,  name:"Alexander the Great",virtue:"Ambition",  text:"Anabasis (Arrian)", lesson:"Ambition needs a terminal goal + succession.", modern:"Build what survives you, not just conquest." },
    { n:10, name:"Theodore Roosevelt",virtue:"Vigor",      text:"The Strenuous Life", lesson:"The body is the foundation, not the afterthought.", modern:"Embodiment is the rare edge in a screen age." },
    { n:11, name:"Dostoevsky",      virtue:"Endurance",    text:"Notes from Underground → The Brothers Karamazov", lesson:"Suffering, metabolized, becomes the work.", modern:"The virtue none of the other ten carry." }
  ];

  let state = storeGet() || { books: [], council: {} };
  if(!Array.isArray(state.books)) state.books=[];
  if(!state.council || typeof state.council!=='object') state.council={};
  const save=()=>storeSet(state);

  // ---- books ----
  const ORDER={reading:0,toread:1,done:2};
  function renderBooks(){
    const el=document.getElementById('bookList');
    const arr=[...state.books].sort((a,b)=>(ORDER[a.status]??1)-(ORDER[b.status]??1));
    if(!arr.length){ el.innerHTML='<div class="empty">No books yet — add what you\'re reading.</div>'; return; }
    const lbl={toread:'To read',reading:'Reading',done:'Done'};
    el.innerHTML=arr.map(b=>`<div class="book" data-id="${b.id}">
      <div class="bMain"><div class="bTitle">${esc(b.title)}</div>
        <div class="bMeta">${esc(b.author||'')}${b.rating?' · '+'★'.repeat(b.rating):''}</div></div>
      <span class="pill ${b.status||'toread'}">${lbl[b.status||'toread']}</span>
      <button class="iconBtn" data-edit="${b.id}">✎</button></div>`).join('');
  }

  const overlay=document.getElementById('overlay'); let editId=null;
  function open(id){
    editId=id||null; const isE=!!id;
    document.getElementById('mDelete').style.display=isE?'inline-flex':'none';
    document.getElementById('mTitle').textContent=isE?'Edit book':'Add book';
    const b=isE?state.books.find(x=>x.id===id):{title:'',author:'',status:'toread',rating:0};
    document.getElementById('mBody').innerHTML=`
      <div class="fieldGrid">
        <div class="field fieldFull"><label class="fieldLabel">Title</label><input class="fieldInput" id="f_title" value="${esc(b.title)}" placeholder="Vagabond"></div>
        <div class="field"><label class="fieldLabel">Author</label><input class="fieldInput" id="f_author" value="${esc(b.author)}" placeholder="Inoue"></div>
        <div class="field"><label class="fieldLabel">Status</label>
          <select class="fieldInput" id="f_status">
            <option value="toread"${b.status==='toread'?' selected':''}>To read</option>
            <option value="reading"${b.status==='reading'?' selected':''}>Reading</option>
            <option value="done"${b.status==='done'?' selected':''}>Done</option></select></div>
        <div class="field fieldFull"><label class="fieldLabel">Rating (0–5)</label><input class="fieldInput" id="f_rating" type="number" min="0" max="5" value="${b.rating||0}"></div>
      </div>`;
    overlay.style.display='grid';
  }
  function close(){ overlay.style.display='none'; editId=null; }
  document.getElementById('mClose').onclick=close;
  document.getElementById('mCancel').onclick=close;
  overlay.addEventListener('click',e=>{ if(e.target===overlay) close(); });
  document.getElementById('addBook').onclick=()=>open();
  document.getElementById('bookList').addEventListener('click',e=>{const b=e.target.closest('[data-edit]'); if(b) open(b.dataset.edit);});
  document.getElementById('mSave').onclick=()=>{
    const t=document.getElementById('f_title').value.trim(); if(!t) return;
    const rec={ title:t, author:document.getElementById('f_author').value.trim(), status:document.getElementById('f_status').value, rating:Math.max(0,Math.min(5,parseInt(document.getElementById('f_rating').value)||0)) };
    if(editId){ Object.assign(state.books.find(x=>x.id===editId),rec); } else { state.books.push({id:uid(),...rec}); }
    save(); close(); renderBooks();
  };
  document.getElementById('mDelete').onclick=()=>{ if(editId){ state.books=state.books.filter(x=>x.id!==editId); save(); close(); renderBooks(); } };

  // ---- council ----
  function renderCouncil(){
    const el=document.getElementById('council');
    el.innerHTML=COUNCIL.map(f=>{
      const done=!!state.council[f.n];
      return `<div class="fig ${done?'is-done':''}">
        <div class="figTop">
          <span class="figNum">${f.n}</span>
          <div style="flex:1"><div class="figName">${esc(f.name)}</div><div class="figVirtue">${esc(f.virtue)} · ${esc(f.text)}</div></div>
          <button class="figCheck ${done?'on':''}" data-fig="${f.n}">${done?'✓ Studied':'Mark studied'}</button>
        </div>
        <div class="figLesson">${esc(f.lesson)}</div>
        <div class="figModern"><b>Now:</b> ${esc(f.modern)}</div>
      </div>`;
    }).join('');
    const done=Object.values(state.council).filter(Boolean).length;
    document.getElementById('councilProg').textContent=done+' / 11';
  }
  document.getElementById('council').addEventListener('click',e=>{
    const b=e.target.closest('[data-fig]'); if(!b) return;
    const n=+b.dataset.fig; state.council[n]=!state.council[n]; save(); renderCouncil();
  });

  renderBooks(); renderCouncil();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="cloud-sync.js"></script>
</body>
</html>
